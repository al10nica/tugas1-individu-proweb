<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUGAS 3</title>
</head>
<body>
    
    <label>Input Bilangan 1 :</label>
    <input type="number" id="Bilangan1">
    <br><br>
    <label>Input Bilangan 2 :</label>
    <input type="number" id="Bilangan2">
    <br><br>

<button onclick="tambah()">+</button>
<button onclick="kurang()">-</button>
<button onclick="kali()">x</button>
<button onclick="bagi()">/</button>
<br><br>

    <label>Output :</label>
    <input type="text" id="Output" readonly>

<script>
    function tambah(){
        let Bilangan1 = Number(document.getElementById("Bilangan1").value);
        let Bilangan2 = Number(document.getElementById("Bilangan2").value);
        let hasil = Bilangan1+Bilangan2; 
        document.getElementById("Output").value = hasil;

    }
    function kurang(){
        let Bilangan1 = Number(document.getElementById("Bilangan1").value);
        let Bilangan2 = Number(document.getElementById("Bilangan2").value);
        let hasil = Bilangan1-Bilangan2; 
        document.getElementById("Output").value = hasil;
    }


    function kali(){
        let Bilangan1 = Number(document.getElementById("Bilangan1").value);
        let Bilangan2 = Number(document.getElementById("Bilangan2").value);
        let hasil = Bilangan1*Bilangan2; 
        document.getElementById("Output").value = hasil;
    }

    
    function bagi(){
        let Bilangan1 = Number(document.getElementById("Bilangan1").value);
        let Bilangan2 = Number(document.getElementById("Bilangan2").value);
        let hasil = Bilangan1/Bilangan2; 
        document.getElementById("Output").value = hasil;
    }
    
</script>
</body>
</html>
